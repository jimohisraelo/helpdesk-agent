<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kora Market Support</title>
  <style>
    :root { --bg: #f6f5f2; --panel: #fff; --text: #1c1b19; --muted: #6b6860; --accent: #0f6b4f; --bubble: #eef3f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --panel: #1f1f1d; --text: #ecebe7; --muted: #a09d94; --accent: #4cc39a; --bubble: #263029; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; height: 100dvh; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    p.hint { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
    #log { flex: 1; overflow-y: auto; background: var(--panel); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; }
    .bot { align-self: flex-start; background: var(--bubble); }
    .bot.thinking { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--muted); background: var(--panel); color: var(--text); font: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Kora Market Support</h1>
    <p class="hint">Demo store. Try: "Where is order KM-10421? My email is ada@example.com" or "What's your return policy?"</p>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" maxlength="2000" placeholder="Type your question…" aria-label="Message" />
      <button id="send">Send</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let conversationId;

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text; // textContent, never innerHTML: replies are untrusted text
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    add("Hi! I can help with orders, delivery, returns and payments. What do you need?", "bot");

    fetch("/api/config")
      .then((r) => r.json())
      .then((cfg) => {
        if (cfg.provider === "mock") {
          document.querySelector("p.hint").textContent +=
            " (Demo mode: replies come from a scripted test model, not a real AI. Orders, tickets and the database are real.)";
        }
      })
      .catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, "user");
      input.value = "";
      send.disabled = true;
      const pending = add("Typing…", "bot thinking");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversationId, message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        conversationId = data.conversationId;
        pending.textContent = data.reply;
        pending.className = "msg bot";
      } catch (err) {
        pending.textContent = err.message;
        pending.className = "msg bot";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
