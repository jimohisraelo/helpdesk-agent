# Render Blueprint: one free web service (Docker) + one free Postgres.
# Runs in free test mode (scripted model, no API key). To use a real model,
# set LLM_PROVIDER=openai and OPENAI_API_KEY in the Render dashboard.
services:
  - type: web
    name: helpdesk-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString

databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk
